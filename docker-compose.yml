# version: '3'
services:
    pwn:
        # container_name: pwn_test
        container_name: pwn
        # image: skysider/pwndocker
        build: .
        image: scorpiontornado/pwndocker:noble
        security_opt:
            - seccomp:unconfined
        cap_add:
            - SYS_PTRACE
        ports:
            - "23946:23946"
        # [Nick] files in ./work (next to this file) appear in /ctf/work in the container.
        # Put per-machine mounts in docker-compose.override.yml, which compose loads automatically.
        volumes:
            - ./work:/ctf/work
